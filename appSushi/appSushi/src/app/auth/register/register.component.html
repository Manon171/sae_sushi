<form (ngSubmit)="submit()">
  <input type="text" placeholder="Prénom" [(ngModel)]="form.firstname" name="firstname" required>
  <input type="text" placeholder="Nom" [(ngModel)]="form.lastname" name="lastname" required>
  <input type="email" placeholder="Email" [(ngModel)]="form.email" name="email" required>
  <input type="password" placeholder="Mot de passe" [(ngModel)]="form.password" name="password" required>

  <button type="submit">Créer un compte</button>
</form>
